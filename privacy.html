<h1>隱私權政策</h1>
<p>最後更新：2026年6月3日</p>
<h2>收集的資料</h2>
<p>Corgi Bot 僅儲存以下資料：使用者 ID、伺服器 ID、貨幣餘額、等級與 XP、遊戲紀錄。</p>
<h2>資料用途</h2>
<p>所有資料僅用於提供機器人功能，不會與第三方共享。</p>
<h2>資料刪除</h2>
<p>如需刪除您的資料，請透過 Discord 聯絡開發者。</p>
<h2>聯絡</h2>
<p>如有隱私相關問題請透過 Discord 聯絡開發者。</p>
